<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>實習 Swipe</title>
  <link rel="stylesheet" href="/shared/style.css" />
  <link rel="stylesheet" href="student.css" />
  <!-- LINE 前端框架 LIFF -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- 手勢庫：滑卡 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1><span class="logo">💼</span><span id="page-title">找實習</span></h1>
    <button class="top-btn" id="open-filter" title="篩選條件">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>篩選</span>
    </button>
  </header>

  <!-- 分頁 1：滑卡找實習 -->
  <main id="tab-swipe" class="tab">
    <div id="deck" class="deck"></div>
    <!-- 動作列：按鈕或直接滑卡都可以 -->
    <div class="swipe-bar" id="actions">
      <div class="sb-side left" aria-hidden="true">
        <svg viewBox="0 0 48 20" width="44" height="18"><path d="M12 10H44" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M12 3L4 10L12 17" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 5H44M30 15H44" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".35"/></svg>
        <span>左滑跳過</span>
      </div>
      <button class="sb-btn skip" data-act="skip" aria-label="跳過">
        <svg viewBox="0 0 24 24" width="30" height="30"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>
      </button>
      <div class="sb-center">
        <svg class="sb-chev" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M6 12L12 6L18 12M6 18L12 12L18 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <button class="sb-btn save" data-act="save" aria-label="收藏">🔔</button>
        <span>上滑收藏</span>
      </div>
      <button class="sb-btn apply" data-act="apply" aria-label="投遞">
        <svg viewBox="0 0 24 24" width="30" height="30"><path d="M21 3L3 10.5L10 13.5L13 21L21 3Z" fill="currentColor"/><path d="M10 13.5L21 3" stroke="#fff" stroke-width="1.4"/></svg>
      </button>
      <div class="sb-side right" aria-hidden="true">
        <svg viewBox="0 0 48 20" width="44" height="18"><path d="M4 10H36" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M36 3L44 10L36 17" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 5H18M4 15H18" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".35"/></svg>
        <span>右滑投遞</span>
      </div>
    </div>
  </main>

  <!-- 分頁 2：收藏與投遞（順序跟官方帳號的圖文選單一致）-->
  <main id="tab-saved" class="tab hidden">
    <div id="saved-list" class="list"></div>
  </main>

  <!-- 分頁 3：履歷 -->
  <main id="tab-resumes" class="tab hidden">
    <div id="resume-list" class="list"></div>
    <div class="pad"><button class="btn block" id="new-resume">＋ 建立新履歷</button></div>
  </main>

  <nav class="tabbar">
    <button data-tab="swipe" class="on">🃏<span>找實習</span></button>
    <button data-tab="saved">🔖<span>收藏・投遞</span></button>
    <button data-tab="resumes">📄<span>我的履歷</span></button>
  </nav>

  <div id="sheet-root"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
